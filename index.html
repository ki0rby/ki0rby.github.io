<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f2ff">
  <title>Gunko's Little Dance</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: #f6f2ff;
      color: #242039;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 82% 25%, #fff 0 3px, transparent 4px),
        radial-gradient(circle at 22% 78%, #e6dcff 0 5px, transparent 6px),
        linear-gradient(145deg, #fff8f4, #eee9ff 60%, #e2f4ff);
      background-size: 120px 120px, 160px 160px, 190px 190px, auto;
    }

    .stage {
      width: min(100%, 560px);
      min-height: 620px;
      padding: 38px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 8vw, 3.3rem);
      letter-spacing: -0.05em;
    }

    .subtitle { margin: 0; color: #69647f; }

    .dance-floor {
      position: relative;
      width: 280px;
      height: 360px;
      margin: 20px auto 10px;
      display: grid;
      place-items: center;
    }

    .sparkle {
      position: absolute;
      color: #f4a8c7;
      font-size: 28px;
      animation: twinkle 1.2s ease-in-out infinite alternate;
    }
    .sparkle.one { top: 54px; left: 20px; }
    .sparkle.two { top: 105px; right: 12px; animation-delay: .4s; }
    .sparkle.three { bottom: 86px; left: 34px; animation-delay: .7s; }

    .shadow {
      position: absolute;
      bottom: 35px;
      width: 145px;
      height: 22px;
      border-radius: 50%;
      background: #b7a7d6;
      opacity: .35;
      animation: shadow 600ms ease-in-out infinite alternate;
    }

    .dancer {
      position: relative;
      width: 170px;
      height: 285px;
      transform-origin: 50% 88%;
      animation: dance 600ms ease-in-out infinite alternate;
    }

    /* Hair behind the head */
    .hair-back {
      position: absolute;
      z-index: 1;
      left: 37px;
      top: 9px;
      width: 96px;
      height: 126px;
      border: 5px solid #25213b;
      border-radius: 48% 48% 42% 42%;
      background: #d7d4ee;
      box-shadow: inset 12px 0 #c5c1e3, inset -12px 0 #e7e4f6;
    }

    .head {
      position: absolute;
      z-index: 3;
      top: 22px;
      left: 49px;
      width: 72px;
      height: 83px;
      border: 4px solid #25213b;
      border-radius: 46% 46% 48% 48%;
      background: #f6d2c4;
    }

    .fringe {
      position: absolute;
      z-index: 4;
      top: 16px;
      left: 44px;
      width: 82px;
      height: 43px;
      border: 4px solid #25213b;
      border-bottom: 0;
      border-radius: 52% 55% 20% 15%;
      background: #d7d4ee;
      transform: rotate(-4deg);
    }
    .fringe::after {
      content: "";
      position: absolute;
      left: 29px;
      top: 20px;
      width: 21px;
      height: 29px;
      border-left: 4px solid #25213b;
      border-radius: 0 0 0 80%;
      transform: rotate(12deg);
    }

    .eye {
      position: absolute;
      top: 58px;
      left: 65px;
      z-index: 5;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #25213b;
    }
    .eye.right { left: 99px; }
    .smile {
      position: absolute;
      z-index: 5;
      top: 78px;
      left: 81px;
      width: 13px;
      height: 7px;
      border-bottom: 2px solid #a34f67;
      border-radius: 50%;
    }

    .neck {
      position: absolute;
      z-index: 2;
      top: 94px;
      left: 75px;
      width: 22px;
      height: 25px;
      background: #f6d2c4;
      border-left: 3px solid #25213b;
      border-right: 3px solid #25213b;
    }

    .body-piece {
      position: absolute;
      z-index: 3;
      top: 112px;
      left: 45px;
      width: 82px;
      height: 94px;
      border: 4px solid #25213b;
      border-radius: 24px 24px 13px 13px;
      background: repeating-linear-gradient(90deg, #fff 0 13px, #394a78 13px 26px);
    }
    .collar {
      position: absolute;
      z-index: 4;
      top: 109px;
      left: 68px;
      width: 37px;
      height: 28px;
      background: #fff;
      border: 4px solid #25213b;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .arm {
      position: absolute;
      z-index: 2;
      top: 119px;
      left: 25px;
      width: 27px;
      height: 87px;
      border: 4px solid #25213b;
      border-radius: 18px;
      background: #f6d2c4;
      transform-origin: 50% 12px;
      animation: wave-left 600ms ease-in-out infinite alternate;
    }
    .arm.right {
      left: 118px;
      top: 119px;
      height: 87px;
      animation-name: wave-right;
    }
    .sleeve {
      position: absolute;
      top: 0;
      left: -4px;
      width: 27px;
      height: 34px;
      border: 4px solid #25213b;
      border-radius: 14px 14px 7px 7px;
      background: #394a78;
    }

    .skirt {
      position: absolute;
      z-index: 4;
      top: 193px;
      left: 35px;
      width: 102px;
      height: 57px;
      border: 4px solid #25213b;
      border-top: 0;
      background: repeating-linear-gradient(90deg, #fff 0 16px, #394a78 16px 32px);
      clip-path: polygon(13% 0, 87% 0, 100% 100%, 0 100%);
      transform-origin: 50% 0;
      animation: skirt-swish 600ms ease-in-out infinite alternate;
    }

    .leg {
      position: absolute;
      z-index: 2;
      top: 237px;
      left: 59px;
      width: 24px;
      height: 42px;
      border: 4px solid #25213b;
      border-radius: 10px;
      background: #f6d2c4;
      transform-origin: 50% 0;
      animation: step-left 600ms ease-in-out infinite alternate;
    }
    .leg.right {
      left: 90px;
      animation-name: step-right;
    }
    .shoe {
      position: absolute;
      bottom: -5px;
      left: -8px;
      width: 34px;
      height: 15px;
      border: 4px solid #25213b;
      border-radius: 12px 12px 8px 8px;
      background: #f29abc;
    }

    .links { display: flex; gap: 12px; margin-top: 12px; }
    .links a {
      padding: 10px 18px;
      border-radius: 999px;
      background: #fff;
      color: #394a78;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px #35265b14;
    }
    .links a:hover, .links a:focus-visible { background: #394a78; color: white; }

    @keyframes dance {
      from { transform: translateY(3px) rotate(-5deg); }
      to { transform: translateY(-9px) rotate(5deg); }
    }
    @keyframes wave-left {
      from { transform: rotate(32deg); }
      to { transform: rotate(-48deg); }
    }
    @keyframes wave-right {
      from { transform: rotate(-32deg); }
      to { transform: rotate(48deg); }
    }
    @keyframes step-left {
      from { transform: rotate(-18deg); }
      to { transform: rotate(17deg); }
    }
    @keyframes step-right {
      from { transform: rotate(17deg); }
      to { transform: rotate(-18deg); }
    }
    @keyframes skirt-swish {
      from { transform: rotate(-7deg); }
      to { transform: rotate(7deg); }
    }
    @keyframes shadow {
      from { transform: scaleX(.85); opacity: .25; }
      to { transform: scaleX(1.05); opacity: .4; }
    }
    @keyframes twinkle {
      from { opacity: .35; transform: scale(.75) rotate(-12deg); }
      to { opacity: 1; transform: scale(1.15) rotate(12deg); }
    }

    @media (max-width: 420px) {
      .stage { min-height: 100vh; padding-top: 20px; }
      .dance-floor { transform: scale(.9); margin: 4px auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1>Gunko's little dance</h1>
    <p class="subtitle">A tiny CSS-only dance break ✨</p>

    <div class="dance-floor" role="img" aria-label="A small cartoon character with pale hair dancing by waving her arms and stepping side to side">
      <span class="sparkle one" aria-hidden="true">✦</span>
      <span class="sparkle two" aria-hidden="true">✧</span>
      <span class="sparkle three" aria-hidden="true">✦</span>
      <div class="shadow" aria-hidden="true"></div>
      <div class="dancer" aria-hidden="true">
        <div class="hair-back"></div>
        <div class="head"></div>
        <div class="fringe"></div>
        <div class="eye"></div>
        <div class="eye right"></div>
        <div class="smile"></div>
        <div class="neck"></div>
        <div class="arm"><div class="sleeve"></div></div>
        <div class="arm right"><div class="sleeve"></div></div>
        <div class="body-piece"></div>
        <div class="collar"></div>
        <div class="skirt"></div>
        <div class="leg"><div class="shoe"></div></div>
        <div class="leg right"><div class="shoe"></div></div>
      </div>
    </div>

    <nav class="links" aria-label="Other pages">
      <a href="hall.html">Hall</a>
      <a href="christ.html">Christ</a>
    </nav>
  </main>
</body>
</html>
